[package]
name = "amallo"
version = "0.1.0"
description = "Securely expose your local Ollama instance via an authenticated ngrok tunnel"
authors = ["tehfonsi <7488280+tehfonsi@users.noreply.github.com>"]
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/OpenCharUI/amallo"
default-run = "amallo"

[lib]
name = "amallo_lib"
# No "cdylib": Tauri's template default includes it for mobile targets
# (Android JNI / iOS bridging), which this desktop-only menu-bar app has
# never scaffolded (no gen/android or gen/ios). On this project's
# x86_64-pc-windows-gnu toolchain, building a cdylib means GNU ld has to
# emit a full DLL export table for the whole dependency graph — once
# aws-lc-rs entered the tree, that table's symbol count exceeded a GNU ld
# limit ("export ordinal too large"), which broke every `cargo build`
# entirely, not just tests. Dropping cdylib removes the need for that
# export table. Re-add it (and re-scaffold mobile targets) if amallo ever
# targets Android/iOS.
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "relay_smoke"
path = "src/bin/relay_smoke.rs"
required-features = ["relay-smoke"]

[features]
# Off by default so `cargo build`/`tauri build` never produces this binary —
# it's a manual debugging tool (see relay_smoke.rs's doc comment), not part
# of the app. Without this gate, tauri-cli's bin-selection has been observed
# to bundle relay_smoke.exe as the app itself instead of the real "amallo"
# binary. Run explicitly with `cargo run --bin relay_smoke --features relay-smoke`.
relay-smoke = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2.5"
tauri-plugin-single-instance = "2.4"
tauri-plugin-store = "2.4"
tauri-plugin-clipboard-manager = "2.3"
tauri-plugin-autostart = "2.5"
ngrok = "0.19"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
# net/io-util/sync/time declared explicitly rather than relying on
# feature-unification from tauri/ngrok/reqwest — proxy.rs already uses
# tokio::net::TcpListener and only compiles today because those other
# crates happen to pull the feature in.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }
# `ServiceExt::oneshot`, used to feed relay-originated requests into the
# same axum Router the local proxy listener serves.
tower = { version = "0.5", features = ["util"] }
# Feeds a relay REQ's chunked body into an http::Request without buffering
# it — the same streaming discipline the local proxy already uses via
# reqwest's Body::wrap_stream.
tokio-stream = { version = "0.1", features = ["sync"] }
reqwest = { version = "0.12", features = ["stream", "rustls-tls"], default-features = false }
rand = "0.9"
subtle = "2"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
local-ip-address = "0.6"
rustls = "0.23"
# wss:// support: rustls-tls-webpki-roots reuses the aws-lc-rs provider
# already installed once in lib.rs's run(), rather than pulling in a second
# TLS stack (ring) the way the plain "native-tls" feature would.
tokio-tungstenite = { version = "0.26", default-features = false, features = [
    "connect",
    "rustls-tls-webpki-roots",
] }
# The E2E handshake and AEAD session (spec §4-§6): P-256 ECDH, HKDF-SHA256,
# HMAC-SHA256, AES-256-GCM. Not a new crypto stack — aws-lc-rs is already
# in the dependency tree as rustls's installed provider (see lib.rs); this
# just adds the direct dependency needed to call its primitives from
# application code instead of only through rustls's TLS-shaped API.
aws-lc-rs = "1"
# base64url encoding for the hello frame's pair_id (spec §3) and the
# pairing URI's pair_id/PSK.
base64 = "0.22"
# Renders the pairing QR (spec §9). default-features = false + explicit
# `svg` feature: the crate's default features also pull in raster-image
# support (the `image` crate) that this never needs, since the PSK only
# ever gets rendered as SVG, not decoded through an intermediate bitmap.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[dev-dependencies]
tempfile = "3"
# Test-only: adds the `json` feature (unioned with the main reqwest dep) so
# sync endpoint tests can serialize/deserialize request and response bodies.
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
