<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>amallo</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="container">
      <header>
        <h1>amallo</h1>
        <p class="subtitle">Secure remote access to your local Ollama</p>
      </header>

      <section class="card">
        <h2>Pairing</h2>
        <p class="hint">
          Scan this from OpenCharUI web (Settings → Remote access) to chat with Ollama from
          anywhere — no network setup required.
        </p>
        <div class="qr-wrap">
          <div id="pairing-qr" class="qr"></div>
        </div>

        <label for="pairing-code">Pairing code <span class="hint">(or paste this instead of scanning)</span></label>
        <div class="row">
          <input id="pairing-code" type="text" readonly />
          <button id="copy-pairing-code" type="button">Copy</button>
          <button id="regen-pairing" type="button" title="Invalidates every paired device">↻</button>
        </div>

        <label for="relay-url">Relay URL <span class="hint">(advanced — leave default unless self-hosting)</span></label>
        <input id="relay-url" type="text" spellcheck="false" />

        <label class="checkbox">
          <input id="auto-connect-relay" type="checkbox" />
          Connect to the relay automatically on launch
        </label>

        <footer id="relay-status" class="status disabled">Relay: disabled</footer>
        <button id="toggle-relay" type="button">Connect Relay</button>
      </section>

      <section class="card">
        <h2>Proxy</h2>
        <div class="row">
          <label for="proxy-port" class="inline">Local port</label>
          <input id="proxy-port" type="number" min="1024" max="65535" />
        </div>
        <label class="checkbox">
          <input id="bind-lan" type="checkbox" />
          Allow LAN access (bind to 0.0.0.0)
        </label>

        <label for="bearer-token">Bearer token <span class="hint">(clients send this as API key)</span></label>
        <div class="row">
          <input id="bearer-token" type="text" readonly />
          <button id="copy-bearer" type="button">Copy</button>
          <button id="regen-bearer" type="button" title="Invalidates the old token immediately">↻</button>
        </div>
      </section>

      <section class="card">
        <h2>Behavior</h2>
        <label class="checkbox">
          <input id="autostart" type="checkbox" />
          Launch amallo at login
        </label>
      </section>

      <p class="autosave-hint">Changes are saved automatically.</p>
    </main>
  </body>
</html>
