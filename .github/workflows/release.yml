name: Release

on:
  push:
    branches: [release/latest]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Analyzes commits since the last release (conventional commits: feat →
  # minor, fix → patch, "BREAKING CHANGE"/"!" → major); if one is
  # warranted, bumps package.json/tauri.conf.json/Cargo.toml, commits and
  # tags that, and publishes the GitHub release with generated notes —
  # no binaries yet, those come from the build job below.
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          # semantic-release needs the full commit/tag history to find
          # the previous release and analyze everything since it — the
          # default shallow clone only has the latest commit.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Semantic release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        with:
          extra_plugins: |
            @semantic-release/exec
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Builds the desktop bundles and attaches them to the release the job
  # above just published — tauri-action finds that existing release by
  # tag rather than creating a second one (see tauri-action's docs on
  # `tagName`). Only runs when a release actually happened: most pushes
  # to release/latest (docs, chores, non-release-worthy fixes) publish
  # nothing.
  build:
    needs: release
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # One leg at a time, deliberately. tauri-action builds latest.json
      # by downloading the copy already on the release, merging its
      # "platforms" map and re-uploading it — a read-modify-write. Run in
      # parallel, the legs race on that asset and silently drop each
      # other's platform entries, leaving a manifest that offers only some
      # platforms an update. Releases are rare enough that serialising the
      # builds is the cheap correct fix.
      max-parallel: 1
      matrix:
        include:
          - platform: macos-latest # arm64
            args: --target aarch64-apple-darwin
            friendly: macos-arm64
          - platform: macos-latest # intel
            args: --target x86_64-apple-darwin
            friendly: macos-x64
          - platform: windows-latest
            args: ""
            friendly: windows-x64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v${{ needs.release.outputs.version }}

      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload to the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts and emits the latest.json manifest
          # beside them. Without these the build still succeeds — it just
          # quietly produces unsigned bundles and no manifest, and every
          # installed copy stays stuck on the version it was installed at.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ needs.release.outputs.version }}
          args: ${{ matrix.args }}
          # matrix.friendly (not tauri-action's own [platform]/[arch]
          # tokens, which just echo the Rust target triple as "darwin"/
          # "aarch64"/etc.) so downloads read as "macos-arm64" rather than
          # requiring users to know Rust target-triple vocabulary. [setup]
          # expands to "-setup" for the NSIS installer and "" otherwise.
          assetNamePattern: "Amallo-[version]-${{ matrix.friendly }}[setup].[ext]"
